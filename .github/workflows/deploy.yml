name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

# One production deploy at a time. Later pushes wait; they are not cancelled.
concurrency:
  group: deploy-peak-view-windows
  cancel-in-progress: false

permissions:
  contents: read

env:
  WRANGLER_VERSION: "4.156.0"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dry-run Wrangler deploy
        run: npx --yes wrangler@${WRANGLER_VERSION} deploy --dry-run

      - name: Check blog/posts.json parses
        run: node -e "JSON.parse(require('fs').readFileSync('blog/posts.json','utf8'))"

  deploy:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: deploy
